<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Jukpo — wordmark</title>
<link rel="icon" id="favicon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: Geist, system-ui, sans-serif; background: #eef0f3; color: #1e1e1e; }
  header { padding: 28px 28px 8px; max-width: 1180px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0 0 6px; }
  header p { margin: 0; color: #5b6270; font-size: 14px; line-height: 1.5; max-width: 760px; }
  main { max-width: 1180px; margin: 0 auto; padding: 12px 28px 60px; display: grid; gap: 18px; }
  .card { background: #fff; border-radius: 18px; padding: 18px 20px 20px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
  .card h2 { font-size: 16px; margin: 0 0 2px; }
  .card h2 b { color: #8a909c; font-weight: 600; margin-right: 6px; }
  .card .why { color: #5b6270; font-size: 13px; margin: 0 0 14px; }
  .row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
  .tile { border-radius: 14px; height: 130px; display: flex; align-items: center; justify-content: center; }
  .tile svg { height: 64px; width: auto; max-width: 92%; }
  .ctx { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 12px; margin-top: 12px; }
  .site { border-radius: 12px; background: #fff; border: 1px solid #e3e5e9; height: 64px; display: flex; align-items: center; padding: 0 18px; gap: 18px; }
  .site svg { height: 26px; width: auto; }
  .site nav { margin-left: auto; display: flex; gap: 16px; font-size: 13px; color: #5b6270; }
  .site nav span { white-space: nowrap; }
  .site nav span:last-child { color: #fff; background: #1e1e1e; padding: 6px 12px; border-radius: 8px; }
  .app { border-radius: 12px; background: #161616; height: 64px; display: flex; align-items: center; gap: 12px; padding: 0 16px; }
  .app .ic { width: 38px; height: 38px; flex: none; }
  .app .ic svg { width: 100%; height: 100%; display: block; }
  .app .wm svg { height: 24px; width: auto; display: block; }
  .small { border-radius: 12px; background: #f7f7f7; height: 64px; display: flex; align-items: center; justify-content: space-around; padding: 0 10px; }
  .small svg { width: auto; display: block; }
  @media (max-width: 760px) {
    header, main { padding-left: 14px; padding-right: 14px; }
    .row, .ctx { grid-template-columns: 1fr; }
    .tile { height: 104px; }
    .tile svg { height: 52px; }
    .site nav span:not(:last-child) { display: none; }
  }
</style>
</head>
<body>
<header>
  <h1>Jukpo — wordmark</h1>
  <p>Each option is shown on paper, on ink and on the Sunrise gradient, then as a site header, beside the Sunrise app icon, and at small sizes (32, 20, 14 px). The old lockup (1) set a heavy icon j next to much thinner text; every new option matches the j to the letters' weight.</p>
</header>
<main id="list"></main>
<script src="/icons/viewer.js?v=60e6d7be"></script>
<script>
// Sunrise, the chosen icon set.
const SUN = ['#fbe38f', '#ff9e7d'];
const SUNRISE = [
  { bg: '#111111', j: SNOW, l: SAGE, r: PEACH },
  { bg: '#ffffff', j: INK, l: SAGE, r: PEACH },
  { bg: SUN, j: INK, l: INK, r: INK },
];
const S = 100; // font size the wordmark is built at; tiles scale it

// Geist's own metrics for a weight, measured from the rendered font so every
// weight Google serves lines up: the dotless j's stem, its top, the advance.
const metrics = {};
function measure(w) {
  if (metrics[w]) return metrics[w];
  const px = 400, c = document.createElement('canvas'); c.width = 1200; c.height = 900;
  const g = c.getContext('2d', { willReadFrequently: true });
  g.font = `${w} ${px}px Geist`; g.fillStyle = '#000';
  const base = 600, x0 = 300;
  g.fillText('\u0237', x0, base);
  const row = y => g.getImageData(0, y, c.width, 1).data;
  const mid = row(base - Math.round(px * .2));
  let L = -1, R = -1;
  for (let x = 0; x < c.width; x++) if (mid[x * 4 + 3] > 128) { if (L < 0) L = x; R = x; }
  const cx = Math.round((L + R) / 2);
  let top = base - Math.round(px * .2);
  while (top > 0 && g.getImageData(cx, top - 1, 1, 1).data[3] > 128) top--;
  const m = {
    stemL: (L - x0) / px * S, stemR: (R + 1 - x0) / px * S,
    top: (base - top) / px * S,
    adv: g.measureText('\u0237').width / px * S,
    desc: g.measureText('p').actualBoundingBoxDescent / px * S,
  };
  m.stem = m.stemR - m.stemL; m.cx = (m.stemL + m.stemR) / 2;
  return metrics[w] = m;
}

// The leaves of the mark, as a tittle on a j whose stem is `stem` wide with its top at
// (cx, top). k scales the mark (stroke 14) to the stem; ls scales the leaves; gap
// lifts them off the stem like the dot of an i.
function tittle(cx, top, stem, l, r, ls = 1, gap = 0) {
  const k = stem / 14;
  return `<g transform="translate(${cx.toFixed(2)} ${(top - gap * S).toFixed(2)}) scale(${k.toFixed(4)})">` +
    leaf(0, 2, -118, 34 * ls, 10 * Math.sqrt(ls), l) + leaf(0, 0, -62, 34 * ls, 10 * Math.sqrt(ls), r) + '</g>';
}

// A wordmark option → SVG markup (viewBox fitted later, once it is in the page).
function wordmark(v, fg, l, r) {
  if (v.old) return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="18 8 140 86">${markBody(fg, l, r)}<text x="66" y="68" font-family="Geist" font-weight="700" font-size="40" letter-spacing="-1" fill="${fg}">ukpo</text></svg>`;
  const m = measure(v.w), ls = (v.track || 0) * S;
  const text = (x, s) => `<text x="${x.toFixed(2)}" y="0" font-family="Geist" font-weight="${v.w}" font-size="${S}" letter-spacing="${ls}" fill="${fg}">${s}</text>`;
  let body;
  if (v.kind === 'type') {
    // Geist's own dotless j, with the leaves for its dot.
    body = text(0, '\u0237ukpo') + tittle(m.cx, -m.top, m.stem, l, r, v.leaf, v.gap);
  } else {
    // The icon's j — flat top, round hook — drawn at the letters' stem weight:
    // top at x-height, hook ending at the descender of p.
    const sw = m.stem, k = sw / 14, cx = m.cx, top = -m.top, hs = m.desc - 23 * k;
    const j = `<path d="M${cx} ${top} V${hs} Q${cx} ${hs + 16 * k} ${cx - 16 * k} ${hs + 16 * k} Q${cx - 24 * k} ${hs + 16 * k} ${cx - 28 * k} ${hs + 9 * k}" fill="none" stroke="${fg}" stroke-width="${sw}" stroke-linecap="butt"/>`;
    body = j + text(m.adv + ls, 'ukpo') + tittle(cx, top, sw, l, r, v.leaf, v.gap);
  }
  return `<svg xmlns="http://www.w3.org/2000/svg" data-fit="1">${body}</svg>`;
}

const OPTIONS = [
  { old: true, name: 'Current', why: 'For reference: the icon’s heavy j beside 700-weight “ukpo”; the j is about twice as thick as the letters and sits low.' },
  { kind: 'type', w: 700, name: 'Typeset · Bold', why: 'Geist’s own j with the leaves for its dot. One weight, one rhythm; the leaves carry the brand.' },
  { kind: 'type', w: 600, name: 'Typeset · SemiBold', why: 'A little lighter and friendlier; the leaves read slightly larger against the thinner letters.' },
  { kind: 'type', w: 800, name: 'Typeset · ExtraBold', why: 'Heavier, closer to the weight of the app icon’s j.' },
  { kind: 'type', w: 700, leaf: 1.45, name: 'Typeset · Bold, bigger leaves', why: 'The sprout is the brand; this makes it the first thing you see.' },
  { kind: 'type', w: 700, gap: .05, name: 'Typeset · Bold, floating leaves', why: 'The leaves sit apart from the stem like the dot of an i — more typographic, less illustration.' },
  { kind: 'type', w: 500, track: -.01, name: 'Typeset · Medium', why: 'Light and calm; reads as product UI more than logo.' },
  { kind: 'custom', w: 700, name: 'Icon j · Bold', why: 'The app icon’s flat-topped j with its rounder hook, redrawn at the letters’ weight, so wordmark and icon share one j.' },
  { kind: 'custom', w: 800, track: -.015, name: 'Icon j · ExtraBold, tight', why: 'Heavier and tighter: the most logo-like of the set.' },
  { kind: 'custom', w: 900, track: -.02, name: 'Icon j · Black', why: 'Maximum weight; strong at small sizes, loud at large ones.' },
  { kind: 'custom', w: 700, leaf: 1.45, name: 'Icon j · Bold, bigger leaves', why: 'Option 8 with the sprout grown: the leaves still read at 20 px, where the smaller ones fade to a dot.' },
  { kind: 'custom', w: 800, leaf: 1.3, track: -.015, name: 'Icon j · ExtraBold, bigger leaves', why: 'Options 9 and 11 together: heavy, tight, and the leaves hold at small sizes.' },
  { kind: 'type', w: 700, mono: true, name: 'Typeset · Bold, one colour', why: 'Option 2 with ink leaves, for places that allow one colour (stamps, embossing, fax-grade print).' },
];

function render() {
  const list = document.getElementById('list');
  list.innerHTML = OPTIONS.map((v, i) => {
    const wm = (fg, l, r) => wordmark(v, fg, v.mono ? fg : l, v.mono ? fg : r);
    const sun = `background:linear-gradient(${SUN[0]}, ${SUN[1]})`;
    return `<section class="card" id="w${i + 1}">
      <h2><b>${i + 1}</b>${v.name}</h2><p class="why">${v.why}</p>
      <div class="row">
        <div class="tile" style="background:#f7f7f7">${wm(INK, SAGE, PEACH)}</div>
        <div class="tile" style="background:#1a1a1a">${wm(SNOW, SAGE, PEACH)}</div>
        <div class="tile" style="${sun}">${wm(INK, INK, INK)}</div>
      </div>
      <div class="ctx">
        <div class="site">${wm(INK, SAGE, PEACH)}<nav><span>Features</span><span>Pricing</span><span>Get Jukpo</span></nav></div>
        <div class="app"><div class="ic">${icon(SUNRISE[2])}</div><div class="wm">${wm(SNOW, SAGE, PEACH)}</div></div>
        <div class="small">${[32, 20, 14].map(h => wm(INK, SAGE, PEACH).replace('<svg ', `<svg style="height:${h}px" `)).join('')}</div>
      </div>
    </section>`;
  }).join('');
  // Fit every SVG's viewBox to what it draws.
  for (const svg of document.querySelectorAll('svg[data-fit]')) {
    const b = svg.getBBox(), p = 2;
    svg.setAttribute('viewBox', `${(b.x - p).toFixed(1)} ${(b.y - p).toFixed(1)} ${(b.width + 2 * p).toFixed(1)} ${(b.height + 2 * p).toFixed(1)}`);
  }
  document.getElementById('favicon').href = 'data:image/svg+xml,' + encodeURIComponent(icon(SUNRISE[2]));
  if (location.hash) document.querySelector(location.hash)?.scrollIntoView();
}

Promise.all([500, 600, 700, 800, 900].map(w => document.fonts.load(`${w} 100px Geist`, '\u0237ukpo'))).then(render);
</script>
</body>
</html>
