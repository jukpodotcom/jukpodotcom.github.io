<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Jukpo — wordmark</title>
<link rel="icon" id="favicon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: Geist, system-ui, sans-serif; background: #eef0f3; color: #1e1e1e; }
  header { padding: 28px 28px 8px; max-width: 1180px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0 0 6px; }
  header p { margin: 0; color: #5b6270; font-size: 14px; line-height: 1.5; max-width: 760px; }
  main { max-width: 1180px; margin: 0 auto; padding: 12px 28px 60px; display: grid; gap: 18px; }
  .card { background: #fff; border-radius: 18px; padding: 18px 20px 20px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
  .card h2 { font-size: 16px; margin: 0 0 2px; }
  .card h2 b { color: #8a909c; font-weight: 600; margin-right: 6px; }
  .card .why { color: #5b6270; font-size: 13px; margin: 0 0 14px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .tile { border-radius: 14px; height: 130px; display: flex; align-items: center; justify-content: center; }
  .tile svg { height: 64px; width: auto; max-width: 92%; }
  .ctx { display: grid; grid-template-columns: 1.3fr 1fr 1fr; gap: 12px; margin-top: 12px; }
  .ctx .small { grid-column: 1 / -1; }
  .site { border-radius: 12px; background: #fff; border: 1px solid #e3e5e9; height: 64px; display: flex; align-items: center; padding: 0 18px; gap: 18px; }
  .site svg { height: 26px; width: auto; }
  .site nav { margin-left: auto; display: flex; gap: 16px; font-size: 13px; color: #5b6270; }
  .site nav span { white-space: nowrap; }
  .site nav span:last-child { color: #fff; background: #1e1e1e; padding: 6px 12px; border-radius: 8px; }
  .app { border-radius: 12px; background: #1f1f1f; height: 64px; display: flex; align-items: center; gap: 12px; padding: 0 16px; }
  .app .ic { width: 38px; height: 38px; flex: none; }
  .app .ic svg { width: 100%; height: 100%; display: block; }
  .app.light { background: #f7f7f7; }
  .app .wm svg { height: 24px; width: auto; display: block; }
  .small { border-radius: 12px; background: #f7f7f7; height: 64px; display: flex; align-items: center; justify-content: space-around; padding: 0 10px; }
  .small svg { width: auto; display: block; }
  @media (max-width: 760px) {
    header, main { padding-left: 14px; padding-right: 14px; }
    .row, .ctx { grid-template-columns: 1fr; }
    .tile { height: 104px; }
    .tile svg { height: 52px; }
    .site nav span:not(:last-child) { display: none; }
  }
</style>
</head>
<body>
<header>
  <h1>Jukpo — wordmark</h1>
  <p><b>Round 4: the k.</b> “ukpo” drawn by hand from the app icon’s j, no font, spaced by the area of white between letters. Black and white only: each option on paper and on ink, then as a site header, beside the black icon (main) and the white icon (light mode), and at 32, 20 and 14 px.</p>
</header>
<main id="list"></main>
<script src="/icons/viewer.js?v=cfd0068c"></script>
<script>
const BLACK = { bg: '#111111', j: SNOW, l: SAGE, r: PEACH }, WHITE = { bg: '#ffffff', j: INK, l: SAGE, r: PEACH, edge: true };
const OPTIONS = [
  { name: 'Wider k', why: 'The same k, opened up: its arm reaches 29 at the x-height and its leg 33 at the baseline, so the k is as wide as the u, and the spacing no longer lets p crowd it.' },
  { o: { kStyle: 'stem' }, name: 'Wider k, arm and leg on the stem', why: 'Arm and leg both start at the stem: a cleaner, more geometric k whose right side reads almost as a straight.' },
  { o: { kStyle: 'curve' }, name: 'Wider k, curved leg', why: 'The leg sweeps out to the baseline like the j’s hook turned around, so the k carries the j’s curve.' },
  { o: { asc: 16 }, name: 'Wider k, shorter stem', why: 'Option 1 with k’s stem 6 shorter, so it does not tower over the wide round letters.' },
  { o: { kStyle: 'curve', asc: 16 }, name: 'Curved leg, shorter stem', why: 'Options 3 and 4 together.' },
  { mono: true, name: 'One colour', why: 'Option 1 with ink leaves, for one-colour printing.' },
];
const svgOf = (v, fg, l, r, h) => `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${wordmarkBox(v.o)}"${h ? ` style="height:${h}px"` : ''}>${wordmarkBody(fg, v.mono ? fg : l, v.mono ? fg : r, v.o)}</svg>`;
document.getElementById('list').innerHTML = OPTIONS.map((v, i) => `<section class="card" id="w${i + 1}">
  <h2><b>${i + 1}</b>${v.name}</h2><p class="why">${v.why}</p>
  <div class="row">
    <div class="tile" style="background:#f7f7f7">${svgOf(v, INK, SAGE, PEACH)}</div>
    <div class="tile" style="background:#1a1a1a">${svgOf(v, SNOW, SAGE, PEACH)}</div>
  </div>
  <div class="ctx">
    <div class="site">${svgOf(v, INK, SAGE, PEACH)}<nav><span>Features</span><span>Pricing</span><span>Get Jukpo</span></nav></div>
    <div class="app light"><div class="ic">${icon(BLACK)}</div><div class="wm">${svgOf(v, INK, SAGE, PEACH)}</div></div>
    <div class="app"><div class="ic">${icon(WHITE)}</div><div class="wm">${svgOf(v, SNOW, SAGE, PEACH)}</div></div>
    <div class="small">${[32, 20, 14].map(h => svgOf(v, INK, SAGE, PEACH, h)).join('')}</div>
  </div>
</section>`).join('');
document.getElementById('favicon').href = 'data:image/svg+xml,' + encodeURIComponent(icon(BLACK, 32));
if (location.hash) document.querySelector(location.hash)?.scrollIntoView();
</script>
</body>
</html>
