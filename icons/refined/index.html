<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Jukpo — refined icons</title>
<link rel="icon" id="favicon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/icons/viewer.css">
</head>
<body data-mode="light" data-phone="on" data-os="ios">
<script src="/icons/viewer.js"></script>
<script>
// The shortlist from /icons (35, 34, 33, 31, 10, 9, 8), then #34 with only the
// white icon's leaf colours varied.
const OPTIONS = [];
const one = (group, name, bg, j, l, r) => OPTIONS.push({ group, name, icons: [{ bg, j, l, r }] });
const BUTTER = '#f6d365', PALE = mix(BUTTER, '#ffffff', .35);
const trio = (name, l, r, bg) => OPTIONS.push({ group: 'Kept · leaf-colour sets', name, icons: [
  { bg: '#111111', j: SNOW, l, r, label: 'black' },
  { bg: '#ffffff', j: INK, l, r, label: 'white' },
  { bg, j: INK, l: INK, r: INK, label: 'ink on colour' },
] });
trio('Leaves · Sage (#35)', mix(SAGE, '#ffffff', .35), SAGE, SAGE);
trio('Leaves · Butter (#34)', PALE, BUTTER, BUTTER);
trio('Leaves · Sage + peach (#33)', SAGE, PEACH, PEACH);
one('Kept · single icons', 'All ink · Cream (#31)', '#f7f0e1', INK, INK, INK);
one('Kept · single icons', 'Original A · Cream (#10)', '#f7f0e1', INK, SAGE, PEACH);
one('Kept · single icons', 'Original A · White (#9)', '#ffffff', INK, SAGE, PEACH);
one('Kept · single icons', 'Original A · Black (#8)', '#0b0b0b', SNOW, SAGE, PEACH);

// #34 as it is, three times over: the black icon and the ink-on-butter icon stay
// exactly as #34 has them; only the leaves of the white icon change, so butter can
// hold on white.
const white34 = (name, l, r) => OPTIONS.push({ group: '#34 · leaf colours on the white icon', name, lock: { l, r }, icons: [
  { bg: '#111111', j: SNOW, l: PALE, r: BUTTER, label: 'black (as #34)' },
  { bg: '#ffffff', j: INK, l, r, label: `white · ${name.toLowerCase()}` },
  { bg: BUTTER, j: INK, l: INK, r: INK, label: 'ink on butter (as #34)' },
] });
white34('Butter (as #34)', PALE, BUTTER);
white34('Butter + amber', BUTTER, '#f2a93b');
white34('Honey + amber', '#f6c453', '#ef9f27');
white34('Gold + amber', '#ebb52f', '#e08a1e');
white34('Saffron + marigold', '#ffc845', '#f59f0a');
white34('Amber + tangerine', '#f7b538', '#f2802a');
white34('Mustard + ochre', '#e2b33a', '#c98a14');
white34('Deep gold', '#e3ab22', '#b8860b');
white34('Honey', '#f3bd3d', '#e0a01a');

// #9 taken further: butter + amber leaves on both the black and the white icon, and
// a soft top-to-bottom gradient behind the ink mark.
const AMBER = '#f2a93b';
const grad9 = (name, top, bottom) => OPTIONS.push({ group: '#9 · butter + amber, gradient third icon', name, lock: { l: BUTTER, r: AMBER }, icons: [
  { bg: '#111111', j: SNOW, l: BUTTER, r: AMBER, label: 'black · butter + amber' },
  { bg: '#ffffff', j: INK, l: BUTTER, r: AMBER, label: 'white · butter + amber' },
  { bg: [top, bottom], j: INK, l: INK, r: INK, label: 'ink on gradient' },
] });
grad9('Butter gradient', '#fbe38f', '#f3c64a');
grad9('Butter to amber', '#f9dc7a', '#f2a93b');
grad9('Butter to honey', '#fbe08a', '#f0b429');
grad9('Pale butter to butter', '#fdf0bf', BUTTER);

startViewer(OPTIONS, 'Jukpo — refined icons');
</script>
</body>
</html>
