<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Jukpo — refined icons</title>
<link rel="icon" id="favicon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/icons/viewer.css?v=cfd0068c">
</head>
<body data-mode="light" data-phone="on" data-os="ios">
<script src="/icons/viewer.js?v=cfd0068c"></script>
<script>
// The chosen pair first, then the shortlist (round two) and the ideas built on it.
const OPTIONS = [];
const BUTTER = '#f6d365', AMBER = '#f2a93b', PALE = mix(BUTTER, '#ffffff', .35);
const one = (group, name, bg, j, l, r) => OPTIONS.push({ group, name, icons: [{ bg, j, l, r }] });
// A set is three icons: black, white, and the ink mark on a colour (flat or [top, bottom]).
const set = (group, name, l, r, third, more = {}) => OPTIONS.push({ group, name, lock: { l, r }, icons: [
  { bg: more.black || '#111111', j: more.blackJ || SNOW, l, r, label: more.blackLabel || 'black' },
  { bg: more.white || '#ffffff', j: INK, l, r, label: more.whiteLabel || 'white' },
  { bg: third, j: INK, l: INK, r: INK, label: more.thirdLabel || 'ink on colour' },
] });

// Chosen: black and white only, sage + peach leaves. Black is the main icon (stores,
// avatars, favicon); white is the light-mode icon and carries a faint edge so it
// keeps its shape on white.
const CHOSEN = 'Chosen';
const pair = (name, black, white) => OPTIONS.push({ group: CHOSEN, name, lock: { l: SAGE, r: PEACH }, icons: [
  { bg: black, j: SNOW, l: SAGE, r: PEACH, label: 'black · main' },
  { bg: white, j: INK, l: SAGE, r: PEACH, edge: true, label: 'white · light mode' },
] });
pair('Black + white', '#111111', '#ffffff');
pair('Black + white · soft depth', ['#2a2a2a', '#0b0b0b'], ['#ffffff', '#f4efe4']);

const KEPT = 'Kept';
set(KEPT, 'Sage + peach (was #33)', SAGE, PEACH, PEACH);
one(KEPT, 'Original A · Cream (was #10)', '#f7f0e1', INK, SAGE, PEACH);
one(KEPT, 'Original A · White (was #9)', '#ffffff', INK, SAGE, PEACH);
one(KEPT, 'Original A · Black (was #8)', '#0b0b0b', SNOW, SAGE, PEACH);
set(KEPT, 'Butter, as #34', PALE, BUTTER, BUTTER);
set(KEPT, 'Butter + amber, butter-to-amber gradient', BUTTER, AMBER, ['#f9dc7a', AMBER], { thirdLabel: 'ink on gradient' });

const IDEAS = 'Ideas';
// iOS and Android now ship an app in three looks: light, dark, and tinted. The set
// above is exactly that, so each idea is shown as the three appearances.
const looks = { blackLabel: 'dark', whiteLabel: 'light', thirdLabel: 'default' };
set(IDEAS, 'Soft depth everywhere', BUTTER, AMBER, ['#f9dc7a', AMBER], { ...looks, black: ['#2a2a2a', '#0b0b0b'], white: ['#ffffff', '#f4efe4'] });
set(IDEAS, 'Butter + sage', BUTTER, SAGE, ['#fbe38f', '#f3c64a'], looks);
set(IDEAS, 'Butter + peach', BUTTER, PEACH, ['#fbe08a', '#ffb07d'], looks);
set(IDEAS, 'Night garden', BUTTER, AMBER, ['#f9dc7a', AMBER], { ...looks, black: ['#1f2d40', '#0e1520'] });
set(IDEAS, 'Golden j', PALE, BUTTER, ['#f9dc7a', AMBER], { ...looks, blackJ: AMBER });
one(IDEAS, 'Favicon: black, butter + amber', '#0b0b0b', SNOW, BUTTER, AMBER);
// Soft depth on single icons, with the original sage + peach leaves.
one(IDEAS, 'Soft depth · Black, sage + peach', ['#2a2a2a', '#0b0b0b'], SNOW, SAGE, PEACH);
one(IDEAS, 'Soft depth · White, sage + peach', ['#ffffff', '#f4efe4'], INK, SAGE, PEACH);

startViewer(OPTIONS, 'Jukpo — refined icons');
</script>
</body>
</html>
