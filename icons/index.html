<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Jukpo — icon options</title>
<link rel="icon" id="favicon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/icons/viewer.css?v=70aa8e2a">
</head>
<body data-mode="light" data-phone="on" data-os="ios">
<script src="/icons/viewer.js?v=70aa8e2a"></script>
<script>
// ---------- every option ----------
const OPTIONS = [];
const add = (group, name, bg, j, l, r) => OPTIONS.push({ group, name, icons: [{ bg, j, l, r }] });
add('Original A · colour leaves', 'Original A · dark', INK, SNOW, SAGE, PEACH);
add('Original A · colour leaves', 'Original A · light', PAPER, INK, SAGE, PEACH);
[ ['Navy', '#1b2a3a'], ['Forest', '#1f3d2e'], ['Plum', '#2d2238'], ['Cocoa', '#3a2a22'], ['Slate', '#2b3440'], ['Black', '#0b0b0b'] ]
  .forEach(([n, c]) => add('Original A · on dark colours', `Original A · ${n}`, c, SNOW, SAGE, PEACH));
[ ['White', '#ffffff'], ['Cream', '#f7f0e1'], ['Sand', '#e8d5b5'], ['Stone', '#c9c9c4'], ['Butter', '#f6d365'], ['Sky', '#8ec5ff'], ['Lilac', '#c8b6ff'], ['Mint', '#bfe9d8'] ]
  .forEach(([n, c]) => add('Original A · on light colours', `Original A · ${n}`, c, INK, SAGE, PEACH));
[ ['Sage', '#8fc39a'], ['Peach', '#ff9e7d'], ['Butter', '#f6d365'], ['Mint', '#7fdcc0'], ['Sky', '#8ec5ff'], ['Lilac', '#c8b6ff'], ['Blush', '#ffb3c7'], ['Apricot', '#ffbe76'],
  ['Lime', '#c7e86b'], ['Sand', '#e8d5b5'], ['Stone', '#c9c9c4'], ['Terracotta', '#e07a5f'], ['Teal', '#3fb8af'], ['Moss', '#a3b18a'], ['Cream', '#f7f0e1'], ['White', '#ffffff'] ]
  .forEach(([n, c]) => add('All ink on colour', `All ink · ${n}`, c, INK, INK, INK));

// Leaf-colour sets: for each colour, the same three icons side by side in every view:
// black with coloured leaves, white with coloured leaves, and all ink on that colour.
[ ['Sage + peach', SAGE, PEACH], ['Butter', '#f6d365'], ['Sage', '#8fc39a'], ['Peach', '#ff9e7d'], ['Mint', '#7fdcc0'], ['Sky', '#8ec5ff'],
  ['Lilac', '#c8b6ff'], ['Blush', '#ffb3c7'], ['Apricot', '#ffbe76'], ['Lime', '#c7e86b'], ['Terracotta', '#e07a5f'], ['Teal', '#3fb8af'] ]
  .forEach(([n, c, c2]) => {
    const l = c2 ? c : mix(c, '#ffffff', .35), r = c2 || c, bg = c2 ? PEACH : c;
    OPTIONS.push({ group: 'Leaf colours · black, white, and ink on colour', name: `Leaves · ${n}`, trio: true, icons: [
      { bg: '#111111', j: SNOW, l, r, label: 'black' },
      { bg: '#ffffff', j: INK, l, r, label: 'white' },
      { bg, j: INK, l: INK, r: INK, label: 'ink on colour' },
    ] });
  });

startViewer(OPTIONS);
</script>
</body>
</html>
