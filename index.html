<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jukpo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <script>
    // Apply saved theme before paint to avoid a flash (default: dark)
    document.documentElement.dataset.theme = localStorage.getItem('theme') || 'dark';
  </script>
  <style>
    :root[data-theme="dark"]  { --bg: #0e0e0e; --fg: #f2f2f2; }
    :root[data-theme="light"] { --bg: #fafafa; --fg: #111111; }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      background: var(--bg);
      color: var(--fg);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.3s, color 0.3s;
      overflow: hidden;
    }

    h1 {
      font-size: clamp(4rem, 18vw, 14rem);
      font-weight: 400;
      line-height: 1;
      opacity: 0;
      transition: opacity 0.4s;
    }
    h1.ready { opacity: 1; }

    #toggle, #shuffle {
      position: fixed;
      top: 1rem;
      width: 2.75rem;
      height: 2.75rem;
      border: 1px solid var(--fg);
      border-radius: 50%;
      background: transparent;
      color: var(--fg);
      font-size: 1.25rem;
      cursor: pointer;
      opacity: 0.7;
      transition: opacity 0.2s;
    }
    #toggle { left: 1rem; }
    #shuffle { right: 1rem; }
    #toggle:hover, #shuffle:hover { opacity: 1; }
  </style>
</head>
<body>
  <button id="toggle" aria-label="Toggle dark/light mode"></button>
  <button id="shuffle" aria-label="Shuffle font" title="Shuffle font">⤮</button>
  <h1 id="title">Jukpo</h1>

  <script>
    // --- Random font ---
    const fonts = [
      'Abril Fatface', 'Alfa Slab One', 'Bangers', 'Black Ops One', 'Bungee',
      'Bungee Shade', 'Bungee Spice', 'Caveat', 'Cinzel Decorative', 'Codystar',
      'Creepster', 'Dancing Script', 'Ewert', 'Fascinate', 'Fascinate Inline',
      'Faster One', 'Frijole', 'Gloria Hallelujah', 'Great Vibes', 'Honk',
      'Kablammo', 'Lobster', 'Londrina Sketch', 'Major Mono Display', 'Megrim',
      'Monoton', 'Nabla', 'Nosifer', 'Orbitron', 'Pacifico',
      'Permanent Marker', 'Plaster', 'Press Start 2P', 'Rampart One', 'Righteous',
      'Rubik Beastly', 'Rubik Glitch', 'Rubik Mono One', 'Rubik Puddles', 'Rubik Wet Paint',
      'Sacramento', 'Shrikhand', 'Silkscreen', 'Special Elite', 'UnifrakturMaguntia',
      'VT323'
    ];
    const title = document.getElementById('title');
    let current = null;
    let token = 0;

    function loadFont(font) {
      const id = 'font-' + font.replace(/ /g, '-');
      if (document.getElementById(id)) return Promise.resolve();
      return new Promise(resolve => {
        const link = document.createElement('link');
        link.id = id;
        link.rel = 'stylesheet';
        link.href = 'https://fonts.googleapis.com/css2?family=' +
          font.replace(/ /g, '+') + '&display=block&text=Jukpo';
        link.onload = link.onerror = resolve;
        document.head.appendChild(link);
      });
    }

    function shuffle() {
      let font;
      do { font = fonts[Math.floor(Math.random() * fonts.length)]; } while (font === current);
      current = font;
      const my = ++token;
      title.classList.remove('ready');
      const show = () => {
        if (my !== token) return; // a newer shuffle took over
        title.style.fontFamily = `"${font}", sans-serif`;
        title.title = font;
        title.classList.add('ready');
      };
      const timeout = new Promise(r => setTimeout(r, 1500)); // fallback if slow
      Promise.race([
        loadFont(font).then(() => document.fonts.load(`1em "${font}"`, 'Jukpo')),
        timeout
      ]).then(show, show);
    }

    document.getElementById('shuffle').addEventListener('click', shuffle);
    shuffle();

    // --- Theme toggle ---
    const btn = document.getElementById('toggle');
    const root = document.documentElement;
    const render = () => { btn.textContent = root.dataset.theme === 'dark' ? '☀' : '☾'; };
    btn.addEventListener('click', () => {
      root.dataset.theme = root.dataset.theme === 'dark' ? 'light' : 'dark';
      localStorage.setItem('theme', root.dataset.theme);
      render();
    });
    render();
  </script>
</body>
</html>
