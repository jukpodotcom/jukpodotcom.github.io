<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark light">
  <meta name="description" content="Explore any topic at your own pace with Jukpo. Lessons guide you, and practice helps you remember what you learn. Coming soon.">
  <title>Jukpo — Coming soon</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <style>
    :root {
      --bg: #111111;
      --ink: #ececec;
      --muted: #bcbfba;
      --lesson: #1c2520;
      --practice: #2b211e;
      --guide: #484b47;
      --sage: #8fc39a;
      --coral: #ff9e7d;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #ffffff;
        --ink: #1e1e1e;
        --muted: #555a55;
        --lesson: #edf5ee;
        --practice: #fff1eb;
        --guide: #ccd5cb;
      }
    }
    body {
      min-height: 100vh;
      min-height: 100svh;
      margin: 0;
      display: grid;
      place-items: center;
      background: var(--bg);
      color: var(--ink);
      font-family: system-ui, sans-serif;
    }
    main {
      box-sizing: border-box;
      width: 100%;
      max-width: 74rem;
      padding: clamp(2rem, 6vw, 4rem) clamp(1.25rem, 5vw, 3rem);
      text-align: center;
    }
    svg { display: block; height: auto; }
    .wordmark {
      width: 7rem;
      margin: 0 auto clamp(1.75rem, 4vw, 3rem);
      fill: var(--ink);
    }
    h1 {
      margin: 0;
      font-size: clamp(2.5rem, 11.5vw, 5rem);
      line-height: 1;
      letter-spacing: -0.065em;
    }
    p {
      max-width: 34ch;
      margin: 1.125rem auto 0;
      color: var(--muted);
      font-size: clamp(1rem, 2.6vw, 1.25rem);
      line-height: 1.55;
    }
    .study {
      width: min(66%, 16rem);
      margin: 1.5rem auto 0;
    }
    @media (min-width: 52rem) {
      main {
        display: grid;
        grid-template-columns: 1.35fr 1fr;
        align-items: center;
        gap: 2rem;
        text-align: start;
      }
      .wordmark { margin-inline: 0; }
      h1 { font-size: clamp(3.5rem, 7.1vw, 6rem); }
      p { margin-inline: 0; }
      .study { width: 100%; margin: 0; }
    }
  </style>
</head>
